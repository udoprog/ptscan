name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: 'nightly'
        type: choice
        options:
        - nightly
        - "%date"
  push:
    tags:
      - '*'

env:
  KICK_VERSION: >-
    ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.version || 'nightly' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: jetli/trunk-action@v0.5.0
      with:
        version: v0.22.1
    - run: trunk build --release
    - run: cargo build --release -p ptscan-server
    - uses: udoprog/kick@nightly
    - run: kick msi --output dist
    - run: kick gh release --github-action --upload "dist/*"
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
