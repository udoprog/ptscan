name: Release

on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string

env:
  KICK_VERSION: "${{github.event.inputs.version || github.ref_name}}"
  RUST_LOG: kick=trace

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - {os: windows-latest, method: zip}
        - {os: ubuntu-latest, method: gzip}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - uses: udoprog/actions@trug
    - uses: udoprog/actions@kick
    - run: trug build --release
    - run: cargo build --release -p ptscan
    - run: kick ${{matrix.method}} --name "ptscan-{release}-{arch}-{os}" --output dist
    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{matrix.os}}
        path: dist

  publish:
    permissions: write-all
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v7
      with: {name: dist-windows-latest, path: dist}
    - uses: actions/download-artifact@v7
      with: {name: dist-ubuntu-latest, path: dist}
    - uses: udoprog/actions@kick
    - run: kick gh release --upload "dist/*" --github-action
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
