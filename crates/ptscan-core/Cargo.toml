[package]
name = "ptscan-core"
version = "0.0.5"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2018"
description = "A memory and pointer scanner for Windows and Linux."
documentation = "https://docs.rs/ptscan"
readme = "README.md"
homepage = "https://udoprog.github.io/ptscan"
repository = "https://github.com/udoprog/ptscan"
license = "MIT OR Apache-2.0"
keywords = ["memory-scanning"]
categories = ["data-structures"]

[dependencies]
dynamicvec = { path = "../dynamicvec" }

anyhow = "1.0.32"
thiserror = "2.0.21"
byteorder = "1.3.4"
rayon = "1.3.1"
fixed-map = { version = "0.9.5", features = ["serde"] }
hashbrown = { version = "0.17.1", features = ["serde"] }
num = { version = "0.4.3" }
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = "0.2.12"
bigdecimal = { version = "0.4.11", features = ["serde"] }
memchr = "2.3.3"
serde = { version = "1.0.115", features = ["rc", "derive"] }
hex = "0.4.2"
regex = "1.3.9"
crossbeam-queue = "0.3.14"
encoding_rs = "0.8.23"
serde_cbor = "0.11.1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]

[target.'cfg(windows)'.dependencies.ntapi]
version = "0.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
