[package]
name = "ptscan-server"
edition = "2024"
publish = false

[dependencies]
api = { path = "../api" }
ptscan = { path = "../ptscan" }
anyhow = "1.0.32"
rayon = "1.3.1"
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
clap = { version = "4.6.7", features = ["derive"] }
musli-web = { version = "0.5.0", default-features = false, features = ["axum08", "format-descriptive", "format-json"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }

[dev-dependencies]
musli-web = { version = "0.5.0", default-features = false, features = ["axum08", "client", "tungstenite029", "format-descriptive"] }
