[package]
name = "ptscan"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
api = { path = "../api", features = ["sqll"] }
ptscan-core = { path = "../ptscan-core" }
anyhow = "1.0.32"
rayon = "1.3.1"
rust-embed = { version = "8.7.2", default-features = false }
mime_guess = { version = "2.0.5", default-features = false }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
musli-web = { version = "0.6.0", default-features = false, features = ["axum08", "format-descriptive", "format-json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2"] }
sqll = { version = "0.15.1", features = ["bundled", "pool"] }
musli = { version = "0.2.1", features = ["json", "alloc"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
musli-web = { version = "0.6.0", default-features = false, features = ["axum08", "client", "tungstenite029", "format-descriptive"] }
tempfile = "3.27.0"
