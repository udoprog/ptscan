[package]
name = "web"
edition = "2024"
publish = false

[dependencies]
api = { path = "../api" }
musli-web = { version = "0.5.0", default-features = false, features = ["web03", "yew023", "format-descriptive", "format-json"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
yew = { version = "0.23.0", features = ["csr"] }
console_error_panic_hook = "0.1.7"
gloo-timers = "0.3.0"
web-sys = { version = "0.3.77", features = ["HtmlInputElement", "MouseEvent", "SubmitEvent"] }
